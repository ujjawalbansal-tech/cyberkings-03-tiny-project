{% extends 'base.html' %}
{% block title %}Login — ZARIYA{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo-dot"></span> ZARIYA
    </div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Login to your account</p>

    <form method="POST">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required />
      </div>
      <button type="submit" class="btn-full-green">Login</button>
    </form>

    <p class="auth-footer">
      No account? <a href="{{ url_for('signup') }}">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
