{% extends 'base.html' %}
{% block title %}Sign Up — KaamConnect{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-brand">
      <span class="logo-dot"></span> KaamConnect
    </div>
    <h2 class="auth-title">Create your account</h2>

    <div class="role-picker">
      <div class="role-opt active" id="opt-customer" onclick="setRole('customer')">
        <div class="role-ico">&#128269;</div>
        <div class="role-lbl">Customer</div>
        <div class="role-hint">Hire workers</div>
      </div>
      <div class="role-opt" id="opt-worker" onclick="setRole('worker')">
        <div class="role-ico">&#128736;</div>
        <div class="role-lbl">Worker</div>
        <div class="role-hint">Find jobs</div>
      </div>
    </div>

    <form method="POST">
      <input type="hidden" name="role" id="role-input" value="customer" />
      <div class="field-grid">
        <div class="field">
          <label>Full name</label>
          <input type="text" name="name" placeholder="Your full name" required />
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label>City / Area</label>
          <input type="text" name="city" placeholder="e.g. Mathura" />
        </div>
      </div>

      <div id="worker-fields" style="display:none;">
        <div class="field-grid">
          <div class="field">
            <label>Your skill</label>
            <select name="skill">
              <option value="">Select skill</option>
              <option>Plumber</option>
              <option>Electrician</option>
              <option>Carpenter</option>
              <option>Painter</option>
              <option>Mason</option>
              <option>Welder</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label>Experience (years)</label>
            <input type="number" name="experience" placeholder="e.g. 3" min="0" />
          </div>
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" id="pw1" placeholder="Min. 6 characters" required minlength="6" />
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" name="confirm" id="pw2" placeholder="Re-enter password" required />
        </div>
      </div>
      <p id="pw-err" style="color:red;font-size:13px;display:none;margin-bottom:8px;">Passwords do not match.</p>

      <button type="submit" class="btn-full-green" onclick="return checkPass()">Create account</button>
    </form>

    <p class="auth-footer">
      Already registered? <a href="{{ url_for('login') }}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
